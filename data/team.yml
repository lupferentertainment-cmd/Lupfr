# LUPFR team. Images go in public/images/team/; reference as /images/team/filename.webp
# Each image is a pre-designed 800x800 card with the person's name/title/location baked
# into the artwork — keep the text block below the image, not overlaid.
# `teams`: one or more of Exec / LA / SF — drives the clickable team filter boxes.
# Omit `image` while a portrait is pending; the card renders a placeholder.
# `founder: true` lifts a member into the larger Founders row above the roster
# grid (bio shown inline, not click-to-expand) and out of the filtered grid.

- name: Will Lupfer
  title: CEO & Founder
  location: Los Angeles & San Francisco
  teams: [Exec]
  founder: true
  image: /images/team/will.webp
  bio: "Will founded LUPFR to bring intentional, artist-first production to live music and events across San Francisco and Los Angeles. Splitting his time between both markets, he leads sponsorship, brand strategy, and the vision behind LUPFR's flagship franchises — from intimate boiler-room sets to full-scale yacht takeovers. An active DJ with a deep personal passion for curated nightlife, Will built the company from the ground up while balancing it alongside a background in infrastructure finance."

- name: Eliott Nazarian
  title: Co-Founder
  location: Los Angeles, CA
  teams: [Exec, LA]
  founder: true
  image: /images/team/eliott.webp
  bio: "Eliott serves as strategic partnerships lead at LUPFR, where he drives business development, brand partnerships, and long-term growth. A licensed attorney with a background spanning entertainment, media, and entrepreneurship, he supports LUPFR's expansion across Los Angeles and beyond. Outside of his legal practice, Eliott is an actor, content creator, and entrepreneur with a passion for entertainment, community-building, and creating meaningful experiences."

- name: Zac Brosky
  title: Event Manager
  location: Los Angeles, CA
  teams: [LA]
  image: /images/team/zac.webp
  bio: "A recent graduate of Loyola Marymount University, Zac spent the last few years as the singer and builder of Midfield Avenue, an LA based band that has also hosted events with emerging artists across California. As both a producer and performer, he's seen firsthand how thoughtfully designed environments elevate the experience for artists and fans alike. Zac handles everything from event production and contractor management to artist relations. He is also a key lead in building out the Los Angeles market, with a focus on our sub-brand \"SEA//SIDE\"."

- name: Kylie Cortez
  title: Legal & Events Intern
  location: Los Angeles, CA
  teams: [LA]
  image: /images/team/kylie.webp
  bio: "Kylie, a rising Senior at USC's Gould School of Law, has long been drawn to music's unique ability to curate spaces for connection and exploration, an interest that has shaped her academic and professional path. She brings an interdisciplinary lens to her work, combining an interest in the legal and operational sides of event production with a genuine passion for the creative and community-building power of live experiences. She assists with everything in SF related to events, contracts, or venue operations."

- name: Cianna Foppoli
  title: Marketing & Strategy Intern
  location: Los Angeles & San Francisco
  teams: [LA, SF]
  image: /images/team/cianna.webp
  bio: "A current student at UC Santa Barbara, Cianna brings a sharp eye for storytelling to LUPFR, blending creative instinct with strategic thinking to build meaningful connections between brands and their audiences. She assists in content creation and social media efforts for the team, developing innovative ways to bring each brand's story to life. Cianna plays a key role in growing LUPFR's presence and delivering standout events across the SF and LA markets."
