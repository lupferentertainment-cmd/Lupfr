# LUPFR team. Images go in public/images/team/; reference as /images/team/filename.webp
# Each image is a pre-designed 800x800 card with the person's name/title/location baked
# into the artwork — keep the text block below the image, not overlaid.
# `teams`: one or more of Exec / LA / SF — drives the clickable team filter boxes.
# Omit `image` while a portrait is pending; the card renders a placeholder.
# `founder: true` lifts a member into the larger Founders row above the roster
# grid (bio shown inline, not click-to-expand) and out of the filtered grid.

- name: Will Lupfer
  title: CEO & Founder
  location: Los Angeles & San Francisco
  teams: [Exec]
  founder: true
  # New outdoor portrait (owner, 2026-08-29: "update Will's image with this
  # (and scale as shown in screenshot)"), replacing the old studio-style
  # will.webp — which stays on disk for an easy revert, same precedent as
  # eliott.webp below. Uncropped: the source is already a near-3:4 portrait
  # (1206x1603), so FounderCard's own object-cover/object-top + lg:scale-[1.14]
  # treatment reproduces the owner's reference screenshot crop on its own —
  # no manual crop needed (verified locally against the screenshot).
  image: /images/team/will-2026.webp
  # Five-paragraph bio, quote, and stats from the AUG 28 restructure design
  # file's founders[0] object (owner note: "New Will bio, five paragraphs").
  # Paragraph 2 references Nike/Phil Knight — previously barred by a 2026-08-08
  # third-party consent guard (Will's father had objected). Owner explicitly
  # lifted that restriction on 2026-08-29 ("its fine to put that full bio in.
  # I no longer reference my dad"); see docs/CHANGELOG.md. The old guard test
  # (tests/unit/founder-bio-consent.test.ts) has been removed accordingly.
  # Paragraphs are blank-line-separated so components/team.tsx's FounderCard
  # splits them into separate <p> tags.
  bio: |
    Will founded LUPFR Entertainment to bring unique, untraditional live music experiences to California. Splitting his time between the LA & SF markets, he leads sponsorship, brand strategy, and the vision behind LUPFR's flagship franchises - from SEA//SIDE yacht charters, SOUND//CHECK artist interviews, and full-scale HIGH//RISE corporate productions.

    Raised in Oregon - Portland first, Bend second - Will grew up around brand-building and entrepreneurship; raised in a Nike family and later exposed to business creation. One house, two lessons: how a great brand gets made, and what it takes to build something of your own. The early culture Phil Knight created serves as the blueprint for LUPFR: build a brand, not a product; sell experience rather than a ticket; and grow an ecosystem of artists, venues, media, and community rather than a company. Nike had Just Do It. LUPFR has Redefine the Music Experience.

    His entrepreneurial track record starts young: at 16 he founded B2 Authentic LLC, an e-commerce business selling custom sports iPhone cases, growing it to $15K+ in revenue, 1,000+ units sold, and a social following of 30K+ before heading to college in Colorado.

    Between ventures, Will built a career in renewable energy project finance, where he led portfolio modeling and diligence on over $2B in debt, tax equity, and development capital financings.

    That range - building a company from scratch as a teenager, executing complex project financings, and now founding and scaling LUPFR Entertainment - reflects the same instinct throughout: take something unstructured and build the infrastructure underneath it.
  quote: "今を生きる - Live in the moment. That is what every LUPFR night is built to deliver."
  stats:
    - value: "20+"
      label: EVENTS PRODUCED
    - value: "5"
      label: BRANDS BUILT
    - value: "$2B+"
      label: FINANCINGS LED

