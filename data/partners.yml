# Corporate partners. Images go in public/corporate_partners/; reference as /corporate_partners/filename.webp
# WebP with alpha: default = mono silhouette (dark in light theme, light in dark theme).
# logoTreatment: outline = thin strokes; solid = softer mono; natural = no filter (full-color).
# imageDark: optional dark-mode variant (e.g. soundcheck_dark.webp); falls back to image if absent.

- name: Umbrella
  url: https://umbrellalive.com
  image: /corporate_partners/umbrella.webp
  logoTreatment: outline
  imageClassName: scale-[1.38]

- name: Eria
  url: https://www.eriaevents.co
  image: /corporate_partners/eria.webp
  imageClassName: scale-[0.88]

- name: Venn Social
  url: https://vennsocial.com
  image: /corporate_partners/venn_social.webp
  # Mono filters collapse this asset to a flat disc; keep full color.
  logoTreatment: natural
  imageClassName: scale-[0.92]

- name: Brixton Bar SF
  url: https://brixtonbarsf.com
  image: /corporate_partners/brixton.webp
  logoTreatment: outline
  imageClassName: scale-[0.9]

- name: Nazarian Law
  url: https://nazarianfirm.com
  image: /corporate_partners/nazarian_law.webp
  logoTreatment: natural
  imageClassName: scale-[0.92]

- name: Empress Yachts
  url: https://www.empressevents.com
  image: /corporate_partners/empress_events.webp
  logoTreatment: natural
  imageClassName: scale-[0.9]

- name: Soundcheck
  image: /corporate_partners/soundcheck_light.webp
  imageDark: /corporate_partners/soundcheck_dark.webp
  logoTreatment: natural
  imageClassName: scale-[1.18]
