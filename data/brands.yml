# LUPFR Website Design v10 (2026-11-11): new live-events brand. Every field is
# transcribed from that design file's own `subbrands` entry (key skiside) —
# name, tag, accent, description, format — with format in this file's
# sentence-case convention. image = its brandPanelPhotos.skiside
# (assets/brands/skiside-bg.png); slashImage = its slashImg mark
# (assets/brands/marks/skiside-slashes.png), drawn in place of the text "//"
# on the home Our Brands tile only. comingSoon mirrors the design's own
# isComingSoon list. Gallery = the six v5 SKI//SIDE photos (2026-11-17).
- key: skiside
  title: "SKI//SIDE"
  tag: "COMING 2027"
  accent: "#5b8ee6"
  image: "/brands/skiside.webp"
  slashImage: "/brands/skiside-slashes.webp"
  description: "Après ski concerts and slopeside sessions at mountain resorts."
  format: "Après sessions · Tahoe"
  # LUPFR Website Design v16 (2026-11-16): per-brand landing copy. tagline/statement/pillars are the design file's placeholder copy (owner to review).
  landing:
    tagline: "Après ski, amplified."
    statement: "Last run. First track."
    cta: "Partner with SKI//SIDE"
    empty: "SKI//SIDE launches in 2027. Follow along for dates and lineups."
    pillars:
      - title: "World-class performers"
        line: "Headline DJ sets as the lifts close, and full live bands on a mountain stage. When the lifts close, the party starts."
