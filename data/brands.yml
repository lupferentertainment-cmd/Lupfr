# The LUPFR portfolio of sub-brands, shown in the "Our Brands" home section and
# each brand's own /brands/<key> detail page.
# accent = per-brand hex used only for the card's tag pill/dot (site otherwise
# uses one shared gold --accent everywhere else). title uses "//" for the
# brand-slash divider (rendered via components/brand-slash-text.tsx).
# image = full-bleed card background photo (site-root, WebP under public/brands/);
# ported from the comp's assets/brands/*-bg.jpg (owner redesign 2026-07-17).
# comingSoon (optional) = brand has no live events yet; detail page shows a
# centered "COMING SOON" block instead of UPCOMING/PAST event lists.
# gallery (optional) = list of site-root WebP paths under public/brands/ shown
# as a 3-up preview grid on the brand detail page (seaside only, per comp).
# deck (optional) = ordered pitch-deck slides (site-root WebP under
# public/brands/) opened by the VIEW DECK viewer on the brand detail page
# (highrise only). The parent LUPFR deck lives in lib/data/brands.ts.
# concepts (optional) = three heading+body pairs from the design file's
# per-brand deck ("THE SERIES · ..." info cards) — seaside/inside/outside
# only, ported verbatim from LUPFR_Restructure.dc.html's deckConfig
# (owner design-file punch list, 2026-08-29).

- key: seaside
  title: "SEA//SIDE"
  tag: YACHTS
  accent: "#6fb8c9"
  # Owner's actual chosen card background (design canvas, 2026-08-28:
  # assets/brands/seaside-bg-v3.jpg, the design file's own brandPanelPhotos.seaside) —
  # re-encoded from that high-res source. Previously stood in with a gallery photo, which
  # was an interim substitute, not the owner's choice.
  image: "/brands/seaside.webp"
  description: "An off-shore music series taking the experience aboard yachts, cruises, and sailboats."
  format: "Yacht sessions · LA & SF · 21+"
  externalUrl: "https://seaside.la"
  gallery:
    - "/brands/seaside-gallery-1.webp"
    - "/brands/seaside-gallery-2.webp"
    - "/brands/seaside-gallery-3.webp"
    - "/brands/seaside-gallery-4.webp"
    - "/brands/seaside-gallery-5.webp"
    - "/brands/seaside-gallery-6.webp"
  concepts:
    - heading: "Offshore Venue"
      body: "Every set happens on the water — yachts, cruises, and sailboats sailing the Bay and the LA coastline."
    - heading: "Music First"
      body: "House and live electronic sets from the LUPFR roster and guest artists, from golden hour to sundown."
    - heading: "The Community"
      body: "An all-white dress code, a boat full of regulars, and the city skyline framing every drop."

- key: highrise
  title: "HIGH//RISE"
  tag: CORPORATE
  accent: "#e08a4a"
  image: "/brands/highrise.webp"
  description: "Corporate galas, product launches, and executive gatherings that produce music with class."
  format: "Corporate events · LA & SF"
  comingSoon: true
  deck:
    - "/brands/highrise-deck-1.webp"
    - "/brands/highrise-deck-2.webp"
    - "/brands/highrise-deck-3.webp"
    - "/brands/highrise-deck-4.webp"
    - "/brands/highrise-deck-5.webp"
    - "/brands/highrise-deck-6.webp"
    - "/brands/highrise-deck-7.webp"

- key: soundcheck
  title: "SOUND//CHECK"
  tag: "COMING FALL 2026"
  accent: "#c9a869"
  image: "/brands/soundcheck.webp"
  description: "The LUPFR podcast — conversations with the artists, producers, and managers shaping the music industry."
  format: "Weekly episodes · LA"
  comingSoon: true

- key: inside
  title: "IN//SIDE"
  tag: INDOORS
  accent: "#e8e4da"
  # Owner-supplied brand header photo (2026-08-29: "first image - IN//SIDE
  # brand header image").
  image: "/brands/inside.webp"
  description: "Indoor live music experiences redefining what nights out mean in California."
  format: "Indoor sessions · LA & SF"
  concepts:
    - heading: "The Room"
      body: "Warehouses, marinas, and unexpected indoor spaces transformed into one-night venues."
    - heading: "Late Sets"
      body: "Programming built for the long haul — doors early, music running well past midnight."
    - heading: "Underground"
      body: "Boiler-room framing, close quarters, and a lineup pulled from the LUPFR network."

- key: outside
  title: "OUT//SIDE"
  tag: OUTDOORS
  accent: "#8aa878"
  image: "/brands/outside.webp"
  description: "The open-air music series melding nature and sound into one."
  format: "Outdoor sessions · LA & SF"
  concepts:
    - heading: "Open Air"
      body: "Rooftops, gardens, and outdoor spaces — no ceilings, no walls, just the horizon."
    - heading: "Golden Hour"
      body: "Sets timed to sundown, when the light and the music peak together."
    - heading: "Nature + Sound"
      body: "Locations chosen so the setting carries as much of the night as the lineup."
