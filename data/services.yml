# Services offered. icon = design-file icon key (Hospitality, Spark, ServiceMusic,
# Pin, Production, Camera — see components/lupfr-service-icons.tsx).
# image = optional thumbnail path (site-root, WebP under public/services/); ported from the
# "LUPFR Website Restructure" comp's per-service thumbnail header (owner redesign 2026-07-16).
# relatedBrands = brand keys from data/brands.yml (comp's per-service related-brand pills,
# owner restructure 2026-07-17); label/accent resolve from brands data at build time.
#
# 2026-10-02 fix, round 2 (owner screenshots of the Claude design file: "the
# services are still the old ones" / "services - still not what the claude
# design file has" / "it should align everything to that"). The 6 services
# below, their order, titles, descriptions and features are transcribed
# verbatim from the design file's own `svcV3` + `SVC` data tables in
# "LUPFR Website v3.dc.html" (not the Coda-templated markup, which only
# shows `{{ }}` placeholders — the literal JS data array further down the
# same file, where this content is hardcoded, not templated). This replaces
# the prior 6 services (Owned Events, Talent Booking, Event Programming,
# Private Events, Event Production, Brand Partnerships), which had drifted
# from the design file's real category set over several redesign passes.
#
# Photos: the design file's own photo paths (assets/services/*.jpg, its
# local design-canvas folder) don't exist in this site's public/ — each
# service below instead reuses the closest real, already-on-site photo by
# content match (confirmed by filename lineage in the prior services.yml's
# own comments, e.g. "event-production-2026.webp" was already sourced from
# the design's own "event-production-v4.jpg"). "Content & Media" has no
# prior services.yml equivalent; reuses public/platforms/platform-media.webp
# (LUPFR's real media team on a shoot), already used elsewhere on the site
# for the same "media/content" meaning, rather than inventing a new asset.

- icon: Hospitality
  title: Private Events
  image: "/services/private-events-2026.webp"
  description: "Celebrations and company gatherings, start to finish."
  features:
    - Celebrations & birthdays
    - Company gatherings
    - Campus events
    - Private yacht charters
  relatedBrands:
    - highrise
    - seaside

- icon: Spark
  title: Brand Activations
  image: "/services/brand-partnerships-2026.webp"
  description: "Bringing your brand into the room."
  features:
    - Creative concept
    - Experiential design
    - Launches & pop-ups
    - Guest engagement
  relatedBrands:
    - soundcheck
    - highrise

- icon: ServiceMusic
  title: Music & Entertainment
  # Reuses the same real stage photo "Talent Booking" (the prior service
  # covering this ground) used — a live band under warm stage lighting,
  # design canvas's own closest equivalent (assets/hero-ideas/slat-band-night.jpg).
  image: "/hero/hero-slat-band.webp"
  description: "DJs, live acts and performance direction."
  features:
    - Talent & Artist booking
    - Musical direction
    - Performances
    - Recorded live sets

- icon: Pin
  title: Venue Programming
  image: "/services/venue-programming.webp"
  description: "Recurring nights for venues, brands and companies."
  features:
    - Recurring series
    - Hotels & restaurants
    - Residential properties
    - Seasonal programming
  relatedBrands:
    - inside
    - outside

- icon: Production
  title: Production
  image: "/services/event-production-2026.webp"
  description: "Venues, vendors, sound, lighting and on-site execution."
  features:
    - Event management
    - Venue sourcing
    - Vendor coordination
    - Sound & lighting
    - Permits & logistics
    - On-site execution

- icon: Camera
  title: Content & Media
  image: "/platforms/platform-media.webp"
  description: "Photo, video and social media management."
  features:
    - Photography
    - Event films
    - Short-form video
    - Social media
